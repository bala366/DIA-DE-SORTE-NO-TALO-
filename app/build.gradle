plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.diadesorte.talov1'
    compileSdk 35

    defaultConfig {
        applicationId "com.diadesorte.talov1"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }
}

chaquopy {
    defaultConfig {
        version = "3.11"
    }
}
